# Example: PHP-FPM 8.4 behind nginx. `docker compose up -d`, then open http://localhost:8080
services:
  php:
    image: openpanel/php-fpm:8.4
    volumes:
      - ./site:/var/www/html
      # - ./php.ini:/usr/local/etc/php/php.ini:ro   # your own php.ini
    environment:
      - APP_USER=www-data            # unprivileged pool (default is root)
    deploy:
      resources:
        limits:
          memory: 512M               # the FPM pool is sized from this

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
