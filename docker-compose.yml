# Example: same service definition OpenPanel uses, only the image changed.
services:
  php-fpm-8.4:
    image: openpanel/php-fpm:8.4
    container_name: php-fpm-8.4
    hostname: php-fpm-8.4
    restart: unless-stopped
    volumes:
      - html_data:/var/www/html/
      - ./sockets/mysqld:/var/run/mysqld
      - ./php.ini/8.4.ini:/usr/local/etc/php/php.ini
      - ./php.ini/8.4.ini:/usr/local/etc/php/conf.d/zz-docker-shinsenter-php.ini:ro
      - /etc/openpanel/wordpress/wp-cli.phar:/usr/local/bin/wp:ro
      - /etc/openpanel/php/ioncube/ioncube_loader_lin_8.4.so:/usr/local/lib/php/extensions/ioncube_loader.so:ro
      - /etc/openpanel/php/ioncube_extension.ini:/usr/local/etc/php/conf.d/docker-php-ext-ioncube.ini:ro
    environment:
      - APP_USER=root
      - APP_GROUP=root
    deploy:
      resources:
        limits:
          cpus: "${PHP_FPM_8_4_CPU:-0.25}"
          memory: "${PHP_FPM_8_4_RAM:-0.5G}"
          pids: "${PHP_FPM_8_4_PIDS:-100}"
    networks:
      - www
      - db
    command: php-fpm --allow-to-run-as-root

volumes:
  html_data:

networks:
  www:
  db:
