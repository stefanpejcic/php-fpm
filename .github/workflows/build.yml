name: Build and publish

# Daily rebuild of every PHP version (picks up new PHP patch releases, Debian security
# updates and new extension versions), plus manual runs from the Actions tab.
on:
  schedule:
    # 16:00 UTC (17:00 CET), after the PHP releases of the day (around 14:00 UTC) and the official images rebuilt on them
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: "PHP versions to build, space separated (empty = all from versions.txt)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["Dockerfile", "build/**", "rootfs/**", "versions.txt", "test.sh", ".github/workflows/build.yml"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: openpanel/php-fpm
  # pulled through Google's Docker Hub mirror, Docker Hub rate-limits pulls (429) and is only used for pushing
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.76.1

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.m.outputs.include }}
      versions: ${{ steps.m.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          WANT: ${{ github.event.inputs.versions }}
        run: |
          set -euo pipefail
          exists() { curl -fsSL -o /dev/null "https://hub.docker.com/v2/repositories/library/php/tags/$1"; }
          rows=()
          versions=()
          while read -r v base fallback composer; do
            [[ -z "$v" || "$v" == \#* ]] && continue
            if [[ -n "${WANT// /}" && " $WANT " != *" $v "* ]]; then continue; fi
            if [[ "$fallback" != "-" ]] && ! exists "$base"; then base="$fallback"; fi
            versions+=("\"$v\"")
            for arch in amd64 arm64; do
              runner=ubuntu-24.04; [[ $arch == arm64 ]] && runner=ubuntu-24.04-arm
              rows+=("{\"version\":\"$v\",\"base\":\"$base\",\"composer\":\"$composer\",\"arch\":\"$arch\",\"runner\":\"$runner\"}")
            done
          done < versions.txt
          [[ ${#rows[@]} -gt 0 ]] || { echo "no matching versions"; exit 1; }
          echo "include=[$(IFS=,; echo "${rows[*]}")]" >> "$GITHUB_OUTPUT"
          echo "versions=[$(IFS=,; echo "${versions[*]}")]" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # base images come from mirror.gcr.io (falls back to Docker Hub), avoids Docker Hub's pull rate limit
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and test
        shell: bash
        run: |
          set -eo pipefail
          start=$(date +%s)
          printf '%s\n' \
            --build-arg PHP_VERSION=${{ matrix.version }} \
            --build-arg BASE_TAG=${{ matrix.base }} \
            --build-arg COMPOSER_VERSION=${{ matrix.composer }} \
            --build-arg VCS_REF=${GITHUB_SHA::7} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) > build.args
          docker buildx build --pull --load $(cat build.args) -t test:${{ matrix.version }} . 2>&1 | tee build.log
          FULL=1 ./test.sh test:${{ matrix.version }} 2>&1 | tee test.log
          mkdir -p digests && echo $(( $(date +%s) - start )) > digests/${{ matrix.arch }}.seconds

      - name: Push by digest (same build, from cache)
        shell: bash
        run: |
          set -eo pipefail
          # Docker Hub answers 429 when its rate limit is hit, retry with a pause before giving up
          for i in 1 2 3; do
            docker buildx build $(cat build.args) \
              --output type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true \
              --metadata-file meta.json . > push.log 2>&1 && break
            tail -5 push.log; [ $i = 3 ] && exit 1; sleep $((i * 60))
          done
          jq -r '."containerimage.digest"' meta.json > digests/${{ matrix.arch }}
          cat digests/${{ matrix.arch }}

      - name: Show failure as annotation
        if: failure()
        shell: bash
        run: |
          f=push.log; [ -s push.log ] || f=test.log; [ -s "$f" ] || f=build.log
          msg=$(tail -40 "$f" 2>/dev/null | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=${{ matrix.version }} ${{ matrix.arch }} failed ($f)::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.version }}-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish:
    needs: [matrix, build]
    if: always() && needs.matrix.result == 'success'
    name: publish ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.version }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch tag ${{ env.IMAGE }}:${{ matrix.version }}
        run: |
          # only publish when both architectures built and passed tests, otherwise the old tag stays
          [ -s digests/amd64 ] && [ -s digests/arm64 ] || { echo "missing an architecture, not publishing"; exit 1; }
          docker buildx imagetools create -t ${IMAGE}:${{ matrix.version }} \
            ${IMAGE}@$(cat digests/amd64) ${IMAGE}@$(cat digests/arm64)
          docker buildx imagetools inspect ${IMAGE}:${{ matrix.version }}

  # Trivy scan of what is published on Docker Hub (amd64 - the packages are the same on arm64).
  # Report only, never blocks: EOL Debian/PHP versions always have unfixable CVEs.
  scan:
    needs: [matrix, publish]
    if: always() && needs.matrix.result == 'success'
    name: scan ${{ matrix.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    env:
      REF: openpanel/php-fpm:${{ matrix.version }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image info
        run: |
          docker pull -q --platform linux/amd64 $REF
          php=$(docker run --rm --entrypoint php $REF -r 'echo PHP_VERSION;')
          debian=$(docker run --rm --entrypoint sh $REF -c '. /etc/os-release; echo "$VERSION"')
          mods=$(docker run --rm --entrypoint php $REF -m | tr '[:upper:]' '[:lower:]')
          missing=()
          for e in apcu bcmath calendar exif ftp gd gettext igbinary intl msgpack mysqli "zend opcache" pcntl pdo_mysql pdo_pgsql pgsql redis sodium tidy uuid yaml zip; do
            [ "$e" = sodium ] && grep -qxE "sodium|libsodium" <<<"$mods" && continue
            grep -qx "$e" <<<"$mods" || missing+=("${e#zend }")
          done
          mkdir -p out
          jq -n --arg php "$php" --arg debian "$debian" --args '{php: $php, debian: $debian, missing_extensions: $ARGS.positional}' "${missing[@]}" > out/info.json
          cat out/info.json

      - name: Trivy scan
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee scan.log) 2>&1
          mkdir -p ~/.cache/trivy
          # scans the copy pulled in "Image info" through the docker socket, no second pull from Docker Hub
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ~/.cache/trivy:/root/.cache/trivy -v "$PWD/out:/out" $TRIVY_IMAGE "$@"; }
          trivy image --quiet --scanners vuln --image-src docker --format json -o /out/trivy.json $REF
          # convert can't filter unfixed findings, so the SARIF comes from a second scan (cached DB, local image)
          trivy image --quiet --scanners vuln --image-src docker --format sarif --severity HIGH,CRITICAL --ignore-unfixed -o /out/trivy.sarif $REF
          jq '[.Results[]?.Vulnerabilities[]? | {id: .VulnerabilityID, sev: .Severity, fix: ((.FixedVersion // "") != "")}] | unique_by(.id) as $v
              | def count(f): reduce ("CRITICAL","HIGH","MEDIUM","LOW") as $s ({}; .[$s] = ([$v[] | select(.sev == $s) | select(f)] | length));
              {vulns: count(true), fixable: count(.fix), scanned: (now | todate)}' out/trivy.json > out/counts.json
          # EOL Debian gets no more package updates, "fixable" there means fixed in a newer Debian only
          jq -s '.[0] + {debian_eol: (.[1].Metadata.OS.EOSL // false)}' out/counts.json out/trivy.json > out/vulns.json
          jq -s 'add' out/info.json out/vulns.json > out/scan.json
          cat out/scan.json
          # Code scanning only for what can be acted on: on EOL Debian nothing can be upgraded, so upload an empty result,
          # which also closes the alerts earlier runs opened for that version
          if [ "$(jq -r .debian_eol out/scan.json)" = true ]; then
            jq '.runs |= map(.results = [])' out/trivy.sarif > out/trivy.sarif.tmp && mv out/trivy.sarif.tmp out/trivy.sarif
          fi
          {
            echo "### $REF"
            echo "PHP $(jq -r .php out/scan.json), Debian $(jq -r .debian out/scan.json)"
            echo "- vulnerabilities C/H/M/L: $(jq -r '.vulns | "\(.CRITICAL) / \(.HIGH) / \(.MEDIUM) / \(.LOW)"' out/scan.json)"
            if [ "$(jq -r .debian_eol out/scan.json)" = true ]; then echo "- Debian EOL: no package updates, not reported to code scanning"
            else echo "- with a fix available (critical/high): $(jq -r '.fixable | "\(.CRITICAL) / \(.HIGH)"' out/scan.json)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show failure as annotation
        if: failure()
        shell: bash
        run: |
          msg=$(tail -40 scan.log 2>/dev/null | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=scan ${{ matrix.version }} failed::$msg"

      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: out/trivy.sarif
          category: php-${{ matrix.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.version }}
          path: out/scan.json
          retention-days: 1

  # Writes the status table in README.md (data kept in status.json, so partial runs keep the other rows)
  report:
    needs: [matrix, scan]
    if: always() && needs.matrix.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Update README status table
        run: |
          python3 build/report.py artifacts
          git diff --stat
      - name: Commit
        run: |
          git diff --quiet -- README.md status.json && { echo "no changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md status.json
          git commit -m "Update image status table [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Sync README to Docker Hub
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: openpanel/php-fpm
          short-description: "Slim, fast-starting Debian PHP-FPM images, PHP 5.6 to 8.6, amd64 + arm64, rebuilt daily"
          readme-filepath: ./README.md
          enable-url-completion: true
